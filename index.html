<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0810">
<title>Senorita</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0810;
  --ink:#f4f1f8;
  --muted:#8a8499;
  --dim:rgba(255,255,255,0.04);
  --line:rgba(255,255,255,0.06);
  --line2:rgba(255,255,255,0.1);
  --rose:#f472b6;
  --violet:#a855f7;
  --cyan:#22d3ee;
  --amber:#fbbf24;
  --danger:#ef4444;
  --ok:#10b981;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  letter-spacing:-0.011em;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(168,85,247,0.18),transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 100%,rgba(244,114,182,0.08),transparent 70%),
    radial-gradient(ellipse 60% 40% at 0% 70%,rgba(34,211,238,0.06),transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}
.app{
  position:relative;z-index:1;height:100vh;height:100dvh;
  display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top);
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;position:relative;
}
.header::after{
  content:'';position:absolute;left:22px;right:22px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent);
}
.brand{display:flex;align-items:center;gap:13px}
.mark{
  width:40px;height:40px;border-radius:14px;
  background:linear-gradient(135deg,#a855f7 0%,#f472b6 55%,#22d3ee 100%);
  display:grid;place-items:center;position:relative;
  box-shadow:0 6px 24px -6px rgba(168,85,247,0.55),inset 0 1px 0 rgba(255,255,255,0.3);
}
.mark::before{
  content:'';position:absolute;inset:1.5px;border-radius:12.5px;
  background:linear-gradient(160deg,#1a1425 0%,#0a0810 100%);
}
.mark span{
  position:relative;z-index:1;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,#f4f1f8,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-0.5px;
}
.identity h1{font-size:15.5px;font-weight:600;letter-spacing:-0.2px;color:var(--ink)}
.identity p{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:2px;font-weight:500}
.actions{display:flex;gap:8px}
.ibtn{
  width:38px;height:38px;border-radius:12px;
  background:var(--dim);border:1px solid var(--line);
  color:var(--ink);display:grid;place-items:center;
  cursor:pointer;transition:all 0.18s;font-size:14px;
}
.ibtn:active{transform:scale(0.92);background:rgba(168,85,247,0.15);border-color:rgba(168,85,247,0.3)}
.status{padding:14px 22px 6px;display:flex;justify-content:center}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:100px;
  background:var(--dim);border:1px solid var(--line);
  font-size:11px;color:var(--muted);font-weight:500;
  letter-spacing:0.2px;transition:all 0.35s;
}
.pill .d{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);transition:all 0.3s}
.pill.listening .d{background:var(--danger);box-shadow:0 0 10px var(--danger);animation:blink 1s infinite}
.pill.thinking .d{background:var(--violet);box-shadow:0 0 10px var(--violet);animation:blink 0.7s infinite}
.pill.speaking .d{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 0.9s infinite}
@keyframes blink{50%{opacity:0.35}}
.stream{
  flex:1;overflow-y:auto;padding:10px 22px 8px;
  display:flex;flex-direction:column;gap:14px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
.stream::-webkit-scrollbar{width:0}
.hero{margin:auto;text-align:center;padding:20px 10px;max-width:340px}
.hero-ring{width:110px;height:110px;margin:0 auto 28px;position:relative}
.hero-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,#a855f7,#f472b6,#22d3ee,transparent);
  animation:spin 6s linear infinite;filter:blur(2px);opacity:0.85;
}
.hero-ring::after{
  content:'';position:absolute;inset:3px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#1e1730,#0a0810 75%);
}
.hero-ring .glow{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,0.4),transparent 65%);
  filter:blur(18px);animation:pulse 4s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
.hero h2{
  font-size:26px;font-weight:600;letter-spacing:-0.6px;
  margin-bottom:10px;line-height:1.2;
  background:linear-gradient(135deg,#f4f1f8 20%,#a855f7 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.6}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.sg{
  padding:9px 15px;border-radius:100px;
  background:var(--dim);border:1px solid var(--line);
  color:var(--ink);font-size:12.5px;cursor:pointer;
  transition:all 0.18s;font-weight:500;
}
.sg:active{background:rgba(168,85,247,0.14);border-color:rgba(168,85,247,0.35);transform:scale(0.97)}
.m{
  max-width:84%;padding:13px 17px;border-radius:22px;
  font-size:15px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap;
  animation:mIn 0.32s cubic-bezier(0.34,1.4,0.64,1);
}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.m.u{
  align-self:flex-end;
  background:linear-gradient(135deg,#8b5cf6,#a855f7);
  color:#fff;border-bottom-right-radius:8px;
  box-shadow:0 8px 22px -10px rgba(139,92,246,0.7);
}
.m.bot{
  align-self:flex-start;
  background:linear-gradient(160deg,rgba(255,255,255,0.055),rgba(255,255,255,0.025));
  border:1px solid var(--line);border-bottom-left-radius:8px;
  backdrop-filter:blur(20px);position:relative;
}
.m.bot::before{
  content:'';position:absolute;left:0;top:12px;bottom:12px;width:2px;
  background:linear-gradient(180deg,#a855f7,#f472b6,#22d3ee);
  border-radius:0 2px 2px 0;opacity:0.9;
}
.m.live{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(139,92,246,0.35),rgba(168,85,247,0.25));
  border:1px dashed rgba(168,85,247,0.5);
  color:#ddd0f5;font-style:italic;border-bottom-right-radius:8px;
}
.cur{
  display:inline-block;width:7px;height:14px;
  background:var(--violet);margin-left:3px;vertical-align:middle;
  border-radius:1.5px;animation:blink 1s infinite;
}
.compose{padding:10px 20px 4px}
.cwrap{
  display:flex;gap:9px;align-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid var(--line2);border-radius:100px;
  padding:5px 5px 5px 20px;transition:all 0.25s;
}
.cwrap:focus-within{
  border-color:rgba(168,85,247,0.5);
  box-shadow:0 0 0 3px rgba(168,85,247,0.1),0 8px 30px -12px rgba(168,85,247,0.4);
  background:linear-gradient(160deg,rgba(255,255,255,0.07),rgba(255,255,255,0.03));
}
.cwrap input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--ink);font-family:inherit;font-size:14.5px;
  padding:10px 0;
}
.cwrap input::placeholder{color:var(--muted)}
.send{
  width:42px;height:42px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,#a855f7,#f472b6);
  color:#fff;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 6px 18px -6px rgba(168,85,247,0.7);
  transition:transform 0.15s;
}
.send:active{transform:scale(0.9)}
.dock{
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:11px;
}
.wave{display:flex;align-items:center;gap:3px;height:20px;opacity:0;transition:opacity 0.3s}
.wave.on{opacity:1}
.wave span{width:2.5px;background:linear-gradient(180deg,#a855f7,#22d3ee);border-radius:3px;height:5px;animation:w 0.9s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:0.1s}
.wave span:nth-child(3){animation-delay:0.2s}
.wave span:nth-child(4){animation-delay:0.3s}
.wave span:nth-child(5){animation-delay:0.4s}
.wave span:nth-child(6){animation-delay:0.3s}
.wave span:nth-child(7){animation-delay:0.2s}
.wave span:nth-child(8){animation-delay:0.1s}
.wave span:nth-child(9){animation-delay:0.05s}
@keyframes w{0%,100%{height:5px}50%{height:18px}}
.orb{position:relative;width:96px;height:96px;display:grid;place-items:center}
.orb::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,#a855f7,#f472b6,#22d3ee,transparent);
  animation:spin 5s linear infinite;opacity:0.75;
  -webkit-mask:radial-gradient(circle,transparent 46%,#000 47%);
  mask:radial-gradient(circle,transparent 46%,#000 47%);
}
.orb .btn{
  width:72px;height:72px;border-radius:50%;border:none;
  background:radial-gradient(circle at 32% 28%,#b975ff,#7c3aed 55%,#4c1d95);
  color:#fff;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 30px -5px rgba(168,85,247,0.65),inset 0 1px 0 rgba(255,255,255,0.25),inset 0 -8px 20px rgba(0,0,0,0.35);
  transition:transform 0.2s,box-shadow 0.3s;
  position:relative;z-index:1;
}
.orb .btn:active{transform:scale(0.93)}
.orb .btn svg{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4))}
.orb.listening .btn{
  background:radial-gradient(circle at 32% 28%,#fb7185,#e11d48 55%,#9f1239);
  box-shadow:0 0 40px -5px rgba(239,68,68,0.8),inset 0 1px 0 rgba(255,255,255,0.3),inset 0 -8px 20px rgba(0,0,0,0.35);
  animation:op 0.85s ease-in-out infinite;
}
.orb.thinking .btn{
  background:radial-gradient(circle at 32% 28%,#c084fc,#7c3aed 55%,#4c1d95);
  box-shadow:0 0 44px -5px rgba(168,85,247,0.9),inset 0 1px 0 rgba(255,255,255,0.3),inset 0 -8px 20px rgba(0,0,0,0.35);
  animation:op 1.3s ease-in-out infinite;
}
.orb.speaking .btn{
  background:radial-gradient(circle at 32% 28%,#5eead4,#0891b2 55%,#155e75);
  box-shadow:0 0 40px -5px rgba(34,211,238,0.7),inset 0 1px 0 rgba(255,255,255,0.3),inset 0 -8px 20px rgba(0,0,0,0.35);
  animation:op 0.7s ease-in-out infinite;
}
@keyframes op{50%{transform:scale(1.05)}}
.mini{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);font-weight:500}
.mini button{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:5px 8px;border-radius:8px;font-family:inherit;font-weight:500;transition:all 0.2s}
.mini button:active{background:var(--dim);color:var(--ink)}
.backdrop{
  position:fixed;inset:0;background:rgba(4,2,8,0.7);
  backdrop-filter:blur(8px);z-index:50;opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:linear-gradient(180deg,#15101f 0%,#0a0810 100%);
  border-top:1px solid var(--line2);
  border-top-left-radius:28px;border-top-right-radius:28px;
  padding:22px 22px calc(32px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform 0.4s cubic-bezier(0.34,1.15,0.64,1);
  max-height:88vh;overflow-y:auto;max-width:560px;margin:0 auto;
  box-shadow:0 -20px 60px -20px rgba(0,0,0,0.9);
}
.sheet.on{transform:translateY(0)}
.handle{width:40px;height:4px;border-radius:100px;background:rgba(255,255,255,0.15);margin:0 auto 26px}
.sec{margin-bottom:26px}
.sec h3{font-size:11.5px;font-weight:600;margin-bottom:13px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{
  padding:14px 15px;border-radius:14px;
  background:linear-gradient(160deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));
  border:1px solid var(--line);color:var(--ink);cursor:pointer;
  transition:all 0.2s;text-align:left;font-family:inherit;
}
.opt:active{transform:scale(0.97)}
.opt.on{
  background:linear-gradient(135deg,rgba(168,85,247,0.18),rgba(244,114,182,0.1));
  border-color:rgba(168,85,247,0.5);
  box-shadow:0 0 22px -8px rgba(168,85,247,0.5);
}
.opt .ot{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.opt .od{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lb{
  padding:11px 5px;border-radius:11px;
  background:var(--dim);border:1px solid var(--line);
  color:var(--ink);font-size:11px;cursor:pointer;
  font-family:inherit;transition:all 0.2s;font-weight:500;
}
.lb.on{
  background:linear-gradient(135deg,rgba(168,85,247,0.22),rgba(34,211,238,0.14));
  border-color:rgba(168,85,247,0.5);
}
.fin{
  width:100%;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#a855f7,#f472b6);
  color:#fff;font-weight:600;font-size:14.5px;cursor:pointer;
  font-family:inherit;
  box-shadow:0 10px 28px -10px rgba(168,85,247,0.8);
  transition:transform 0.15s;
}
.fin:active{transform:scale(0.98)}
.hint{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.hint a{color:var(--rose);text-decoration:none}
.tin{
  width:100%;padding:14px 16px;border-radius:13px;
  background:var(--dim);border:1px solid var(--line);
  color:var(--ink);font-family:inherit;font-size:13.5px;outline:none;
  transition:all 0.2s;
}
.tin:focus{border-color:rgba(168,85,247,0.5);box-shadow:0 0 0 3px rgba(168,85,247,0.1)}
.toast{
  position:fixed;bottom:160px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,14,32,0.96);border:1px solid var(--line2);
  padding:11px 20px;border-radius:100px;font-size:12.5px;
  color:var(--ink);backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:all 0.3s;
  z-index:100;max-width:88vw;text-align:center;font-weight:500;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="mark"><span>से</span></div>
      <div class="identity">
        <h1 id="bName">Senorita</h1>
        <p id="bMode">Concise</p>
      </div>
    </div>
    <div class="actions">
      <button class="ibtn" id="clearBtn" title="Clear">🗑</button>
      <button class="ibtn" id="setBtn" title="Settings">⚙</button>
    </div>
  </header>

  <div class="status">
    <div class="pill" id="pill">
      <span class="d"></span>
      <span id="stText">Ready</span>
    </div>
  </div>

  <main class="stream" id="stream">
    <div class="hero" id="hero">
      <div class="hero-ring"><div class="glow"></div></div>
      <h2 id="heroTitle">Hi, I'm Senorita</h2>
      <p id="heroSub">Ask anything — clear and accurate answers, in any language.</p>
      <div class="suggest">
        <div class="sg" data-q="What is the capital of Australia?">🌍 Quick fact</div>
        <div class="sg" data-q="Explain quantum entanglement in 2 lines">🧠 Explain</div>
        <div class="sg" data-q="Give me one productivity tip">⚡ Tip</div>
        <div class="sg" data-q="Tell me something surprising">✨ Surprise me</div>
      </div>
    </div>
  </main>

  <div class="compose">
    <div class="cwrap">
      <input id="ti" type="text" placeholder="Ask anything..." enterkeyhint="send" autocomplete="off">
      <button class="send" id="sb" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <div class="dock">
    <div class="wave" id="wave">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="orb" id="orb">
      <button class="btn" id="orbBtn" aria-label="Talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="mini">
      <button id="muteBtn">🔊 Voice</button>
      <span>·</span>
      <button id="langBtn">🌐 Auto</button>
    </div>
  </div>
</div>

<div class="backdrop" id="bd"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>

  <div class="sec">
    <h3>Gemini API Key</h3>
    <input id="ki" type="password" class="tin" placeholder="AIzaSy...">
    <div class="hint">Free: <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a> · Saved locally only</div>
  </div>

  <div class="sec">
    <h3>Response Style</h3>
    <div class="grid2" id="pg">
      <button class="opt on" data-p="concise"><div class="ot">⚡ Concise</div><div class="od">Short, direct</div></button>
      <button class="opt" data-p="detailed"><div class="ot">📖 Detailed</div><div class="od">With context</div></button>
      <button class="opt" data-p="expert"><div class="ot">🎯 Expert</div><div class="od">Technical</div></button>
      <button class="opt" data-p="friendly"><div class="ot">💬 Friendly</div><div class="od">Warm</div></button>
    </div>
  </div>

  <div class="sec">
    <h3>Language</h3>
    <div class="grid3" id="lg">
      <button class="lb on" data-l="auto">🌐 Auto</button>
      <button class="lb" data-l="hi-IN">हिन्दी</button>
      <button class="lb" data-l="en-IN">English</button>
      <button class="lb" data-l="bn-IN">বাংলা</button>
      <button class="lb" data-l="ta-IN">தமிழ்</button>
      <button class="lb" data-l="te-IN">తెలుగు</button>
      <button class="lb" data-l="mr-IN">मराठी</button>
      <button class="lb" data-l="gu-IN">ગુજરાતી</button>
      <button class="lb" data-l="kn-IN">ಕನ್ನಡ</button>
      <button class="lb" data-l="ml-IN">മലയാളം</button>
      <button class="lb" data-l="pa-IN">ਪੰਜਾਬੀ</button>
      <button class="lb" data-l="ur-IN">اردو</button>
    </div>
  </div>

  <div class="sec">
    <h3>Voice</h3>
    <div class="grid2" id="vg">

const P = {

const LANGS = {
  'auto':{stt:'hi-IN',tts:'hi-IN',n:'Auto'},

const $ = id => document.getElementById(id);
const stream=$('stream'), pill=$('pill'), stText=$('stText');
const wave=$('wave'), orb=$('orb'), orbBtn=$('orbBtn');
const hero=$('hero'), toast=$('toast');
const sheet=$('sheet'), bd=$('bd');
const ti=$('ti'), sb=$('sb');

function init(){
  $('bName').textContent = state.name;
  $('bMode').textContent = P[state.persona].label;
  $('ni').value = state.name;
  $('ki').value = getKey();
  document.title = state.name;

  document.querySelectorAll('#pg .opt').forEach(o => o.classList.toggle('on', o.dataset.p === state.persona));
  document.querySelectorAll('#lg .lb').forEach(o => o.classList.toggle('on', o.dataset.l === state.lang));
  document.querySelectorAll('#vg .opt').forEach(o => o.classList.toggle('on', o.dataset.v === state.voice));

  $('muteBtn').textContent = (state.voice === 'off' ? '🔇 ' : '🔊 ') + t(state.voice === 'off' ? 'off' : 'on');
  $('langBtn').textContent = '🌐 ' + LANGS[state.lang].n;
  stText.textContent = t('ready');
  ti.placeholder = t('ph');

  const ht=$('heroTitle'), hs=$('heroSub');
  if(ht) ht.textContent = t('hi');
  if(hs) hs.textContent = t('hs');

  if(!getKey()){
    setTimeout(() => {
      sheet.classList.add('on'); bd.classList.add('on');
      toastMsg(t('nk'));
    }, 700);
  }
}

function setStatus(mode=''){
  const m = {'':'ready',listening:'listening',thinking:'thinking',speaking:'speaking'};
  stText.textContent = t(m[mode]||'ready');
  pill.className = 'pill ' + mode;
  orb.className = 'orb ' + mode;
  wave.classList.toggle('on', mode === 'listening');
}

function toastMsg(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('on'), 2400);
}

function scrollEnd(){ requestAnimationFrame(() => stream.scrollTop = stream.scrollHeight); }

function addMsg(role, text){
  if(hero.parentNode) hero.remove();
  const el = document.createElement('div');
  el.className = 'm ' + role;
  el.textContent = text;
  stream.appendChild(el);
  scrollEnd();
  return el;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, listening=false, finalTxt='', liveEl=null;

if(SR){
  recog = new SR();
  recog.continuous = false;
  recog.interimResults = true;
  recog.maxAlternatives = 1;

  recog.onstart = () => {
    listening = true; finalTxt = '';
    setStatus('listening');
    liveEl = document.createElement('div');
    liveEl.className = 'm live';
    liveEl.textContent = '...';
    if(hero.parentNode) hero.remove();
    stream.appendChild(liveEl);
    scrollEnd();
    if(navigator.vibrate) navigator.vibrate(20);
  };

  recog.onresult = (e) => {
    let i = '';
    for(let k=e.resultIndex; k<e.results.length; k++){
      const tx = e.results[k][0].transcript;
      if(e.results[k].isFinal) finalTxt += tx; else i += tx;
    }
    if(liveEl){ liveEl.textContent = (finalTxt + i) || '...'; scrollEnd(); }
  };

  recog.onerror = (e) => {
    if(e.error==='no-speech') toastMsg(t('ns'));
    else if(e.error==='not-allowed') toastMsg(t('nm'));
    else if(e.error!=='aborted') toastMsg('Error: ' + e.error);
    stopCleanup();
  };

  recog.onend = () => {
    stopCleanup();
    const txt = finalTxt.trim();
    if(txt){
      if(liveEl){ liveEl.remove(); liveEl = null; }
      addMsg('u', txt);
      ask(txt);
    } else {
      if(liveEl) liveEl.remove();
      setStatus();
    }
  };
}

function stopCleanup(){
  listening = false;
  if(orb.className.includes('listening')) setStatus();
}

function startMic(){
  if(!recog){ toastMsg('Speech not supported'); return; }
  if(!getKey()){
    toastMsg(t('nk'));
    sheet.classList.add('on'); bd.classList.add('on');
    return;
  }
  if(listening){ recog.stop(); return; }
  recog.lang = LANGS[state.lang].stt;
  try{ recog.start(); } catch(e){ console.warn(e); }
}

function send(){
  const v = ti.value.trim();
  if(!v) return;
  if(!getKey()){
    toastMsg(t('nk'));
    sheet.classList.add('on'); bd.classList.add('on');
    return;
  }
  ti.value = '';
  addMsg('u', v);
  ask(v);
  ti.focus();
}
sb.onclick = send;
ti.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); send(); }
});

async function ask(prompt){
  const key = getKey();
  if(!key){
    addMsg('bot', '⚠️ ' + t('nk'));
    setStatus();
    return;
  }

  setStatus('thinking');

  const langRule = state.lang === 'auto'
    ? "Detect the user's language and reply in that SAME language. If they mix, mix naturally."
    : `Reply ONLY in ${LANGS[state.lang].n}.`;

  const sys = P[state.persona].sys + '\n\n' + langRule;

  state.history.push({ role:'user', parts:[{text: prompt}] });
  if(state.history.length > 16) state.history = state.history.slice(-16);

  const body = {
    systemInstruction:{ parts:[{text: sys}] },
    contents: state.history,
    generationConfig:{ temperature: 0.75, maxOutputTokens: 700, topP: 0.92 }
  };

  const botEl = addMsg('bot', '');
  botEl.innerHTML = '<span class="cur"></span>';

  let full = '';
  let err = null;
  let ok = false;

  for(const model of MODELS){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${key}`;
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });

      if(!res.ok){
        const txt = await res.text();
        err = new Error(res.status + ': ' + txt.slice(0, 150));
        continue;
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      full = '';

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split('\n');
        buf = lines.pop();
        for(const ln of lines){
          if(!ln.startsWith('data: ')) continue;
          const j = ln.slice(6).trim();
          if(!j || j === '[DONE]') continue;
          try{
            const o = JSON.parse(j);
            const pts = o.candidates?.[0]?.content?.parts;
            if(pts) for(const p of pts) if(p.text) full += p.text;
          }catch(_){}
        }
        botEl.innerHTML = escape(full) + '<span class="cur"></span>';
        scrollEnd();
      }

      if(full.trim().length > 0){
        ok = true;
        break;
      }
      err = new Error('Empty response');
      continue;

    } catch(e){
      err = e;
      continue;
    }
  }

  if(ok){
    botEl.textContent = full;
    state.history.push({ role:'model', parts:[{text: full}] });
    setStatus();
    speak(full);
  } else {
    botEl.textContent = '⚠️ ' + (err?.message || 'Failed. Try again.');
    setStatus();
  }
}

function escape(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let voices = [];
function loadV(){ voices = speechSynthesis.getVoices() || []; }

function bestVoice(lang){
  if(!voices.length) loadV();
  const base = lang.split('-')[0];
  const female = ['neerja','swara','female','woman','samantha','zira','aria','jenny'];
  const brand  = ['google','microsoft'];

  let v = voices.find(x => x.lang === lang && female.some(f => x.name.toLowerCase().includes(f)));
  if(v) return v;
  v = voices.find(x => x.lang === lang && brand.some(b => x.name.toLowerCase().includes(b)));
  if(v) return v;
  v = voices.find(x => x.lang === lang);
  if(v) return v;
  v = voices.find(x => x.lang.startsWith(base) && female.some(f => x.name.toLowerCase().includes(f)));
  if(v) return v;
  v = voices.find(x => x.lang.startsWith(base));
  if(v) return v;
  v = voices.find(x => x.lang.startsWith('hi'));
  if(v) return v;
  return null;
}

function speak(text){
  if(state.voice === 'off' || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();

  const clean = text.replace(/[*_`#>~]/g, '').replace(/\[.*?\]\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
  if(!clean) return;

  const speech = clean.length > 400 ? clean.slice(0, 400) : clean;
  const u = new SpeechSynthesisUtterance(speech);

  let tl = LANGS[state.lang].tts;
  if(state.lang === 'auto'){
    if(/[\u0900-\u097F]/.test(text)) tl = 'hi-IN';
    else if(/[\u0980-\u09FF]/.test(text)) tl = 'bn-IN';
    else if(/[\u0B80-\u0BFF]/.test(text)) tl = 'ta-IN';
    else if(/[\u0C00-\u0C7F]/.test(text)) tl = 'te-IN';
    else if(/[\u0C80-\u0CFF]/.test(text)) tl = 'kn-IN';
    else if(/[\u0D00-\u0D7F]/.test(text)) tl = 'ml-IN';
    else if(/[\u0A00-\u0A7F]/.test(text)) tl = 'pa-IN';
    else if(/[\u0600-\u06FF]/.test(text)) tl = 'ur-IN';
    else tl = 'en-IN';
  }

  u.lang = tl;
  u.rate = 0.98;
  u.pitch = 1.02;
  u.volume = 1;

  const v = bestVoice(tl);
  if(v) u.voice = v;

  u.onstart = () => setStatus('speaking');
  u.onend = () => setStatus();
  u.onerror = () => setStatus();

  speechSynthesis.speak(u);
}

orbBtn.addEventListener('click', startMic);

document.querySelectorAll('.sg').forEach(c => {
  c.addEventListener('click', () => {
    const q = c.dataset.q;
    addMsg('u', q);
    ask(q);
  });
});

$('setBtn').onclick = () => { sheet.classList.add('on'); bd.classList.add('on'); };
bd.onclick = () => { sheet.classList.remove('on'); bd.classList.remove('on'); };

$('saveBtn').onclick = () => {
  const k = $('ki').value.trim();
  if(k) localStorage.setItem('senorita_key', k);
  state.name = $('ni').value.trim() || 'Senorita';
  localStorage.setItem('s_n', state.name);
  localStorage.setItem('s_p', state.persona);
  localStorage.setItem('s_l', state.lang);
  localStorage.setItem('s_v', state.voice);
  init();
  sheet.classList.remove('on'); bd.classList.remove('on');
  toastMsg(t('ss'));
};

document.querySelectorAll('#pg .opt').forEach(o => {
  o.onclick = () => {
    document.querySelectorAll('#pg .opt').forEach(x => x.classList.remove('on'));
    o.classList.add('on');
    state.persona = o.dataset.p;
    $('bMode').textContent = P[state.persona].label;
  };
});

document.querySelectorAll('#lg .lb').forEach(o => {
  o.onclick = () => {
    document.querySelectorAll('#lg .lb').forEach(x => x.classList.remove('on'));
    o.classList.add('on');
    state.lang = o.dataset.l;
    stText.textContent = t('ready');
    ti.placeholder = t('ph');
    $('muteBtn').textContent = (state.voice === 'off' ? '🔇 ' : '🔊 ') + t(state.voice === 'off' ? 'off' : 'on');
    const ht=$('heroTitle'), hs=$('heroSub');
    if(ht) ht.textContent = t('hi');
    if(hs) hs.textContent = t('hs');
  };
});

document.querySelectorAll('#vg .opt').forEach(o => {
  o.onclick = () => {
    document.querySelectorAll('#vg .opt').forEach(x => x.classList.remove('on'));
    o.classList.add('on');
    state.voice = o.dataset.v;
    $('muteBtn').textContent = (state.voice === 'off' ? '🔇 ' : '🔊 ') + t(state.voice === 'off' ? 'off' : 'on');
    if(state.voice === 'off') speechSynthesis.cancel();
  };
});

$('muteBtn').onclick = () => {
  state.voice = state.voice === 'off' ? 'auto' : 'off';
  localStorage.setItem('s_v', state.voice);
  $('muteBtn').textContent = (state.voice === 'off' ? '🔇 ' : '🔊 ') + t(state.voice === 'off' ? 'off' : 'on');
  document.querySelectorAll('#vg .opt').forEach(x => x.classList.toggle('on', x.dataset.v === state.voice));
  if(state.voice === 'off') speechSynthesis.cancel();
  toastMsg(state.voice === 'off' ? t('off') : t('on'));
};

$('langBtn').onclick = () => {
  const keys = Object.keys(LANGS);
  const nx = keys[(keys.indexOf(state.lang) + 1) % keys.length];
  state.lang = nx;
  localStorage.setItem('s_l', nx);
  document.querySelectorAll('#lg .lb').forEach(x => x.classList.toggle('on', x.dataset.l === nx));
  $('langBtn').textContent = '🌐 ' + LANGS[nx].n;
  stText.textContent = t('ready');
  ti.placeholder = t('ph');
  toastMsg(t('ls') + LANGS[nx].n);
};

$('clearBtn').onclick = () => {
  if(!confirm(t('cq'))) return;
  state.history = [];
  stream.innerHTML = '';
  stream.appendChild(hero);
  hero.style.display = '';
  setStatus();
  speechSynthesis.cancel();
  toastMsg(t('cc'));
};

document.addEventListener('keydown', e => {
  if(e.code === 'Space' && e.target === document.body){
    e.preventDefault();
    startMic();
  }
});

loadV();
speechSynthesis.onvoiceschanged = loadV;

init();
</script>
</body>
</html>
