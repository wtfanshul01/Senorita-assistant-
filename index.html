<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Senorita · AI Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#08050f;--surface:rgba(255,255,255,0.045);
  --border:rgba(255,255,255,0.07);
  --text:#f0edf7;--muted:#7f7a92;
  --accent:#a855f7;--accent2:#06b6d4;
  --user:#7c3aed;--danger:#ef4444;--ok:#10b981;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  position:relative;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:-50%;z-index:0;
  background:
    radial-gradient(circle at 15% 15%,rgba(168,85,247,0.12),transparent 45%),
    radial-gradient(circle at 85% 25%,rgba(6,182,212,0.08),transparent 45%),
    radial-gradient(circle at 50% 95%,rgba(244,114,182,0.08),transparent 50%);
  animation:aurora 24s ease-in-out infinite;pointer-events:none;
}
@keyframes aurora{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(4%,-3%) scale(1.08)}
}
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top);
}
/* ── Header ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  background:linear-gradient(180deg,rgba(8,5,15,0.92),rgba(8,5,15,0.3));
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:38px;height:38px;border-radius:12px;
  background:conic-gradient(from 0deg,#a855f7,#06b6d4,#f472b6,#a855f7);
  display:grid;place-items:center;position:relative;
  box-shadow:0 4px 18px rgba(168,85,247,0.45);
  animation:spin 10s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.logo::after{
  content:'';position:absolute;inset:3px;border-radius:9px;
  background:var(--bg);animation:spin 10s linear infinite reverse;
}
.logo span{
  position:relative;z-index:1;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,#c084fc,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-info h1{
  font-size:15px;font-weight:700;letter-spacing:0.3px;
  background:linear-gradient(135deg,#fff,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-info p{font-size:9.5px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase;margin-top:2px}
.header-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);display:grid;place-items:center;
  cursor:pointer;transition:all 0.2s;font-size:15px;
}
.icon-btn:active{transform:scale(0.9);background:rgba(168,85,247,0.2)}
/* ── Status ── */
.status-bar{padding:12px 20px;display:flex;justify-content:center}
.status-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  font-size:11px;color:var(--muted);letter-spacing:0.4px;
  transition:all 0.3s;
}
.status-chip .dot{
  width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 8px var(--ok);transition:all 0.3s;
}
.status-chip.listening .dot{background:var(--danger);box-shadow:0 0 8px var(--danger);animation:blink 1s infinite}
.status-chip.thinking .dot{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 0.6s infinite}
.status-chip.speaking .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2);animation:blink 0.8s infinite}
@keyframes blink{50%{opacity:0.3}}
/* ── Chat ── */
.chat{
  flex:1;overflow-y:auto;
  padding:8px 20px 16px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
.chat::-webkit-scrollbar{width:0}
.welcome{margin:auto;text-align:center;padding:24px 12px}
.welcome-orb{
  width:96px;height:96px;margin:0 auto 24px;border-radius:50%;
  background:conic-gradient(from 0deg,#a855f7,#06b6d4,#f472b6,#a855f7);
  position:relative;animation:spin 8s linear infinite;
  opacity:0.95;
}
.welcome-orb::after{
  content:'';position:absolute;inset:5px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#1a0f2e,#08050f);
}
.welcome h2{
  font-size:24px;font-weight:700;margin-bottom:10px;letter-spacing:-0.3px;
  background:linear-gradient(135deg,#fff,#a855f7,#06b6d4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome p{color:var(--muted);font-size:13.5px;line-height:1.65;max-width:300px;margin:0 auto}
.welcome-chips{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px;
}
.chip{
  padding:8px 16px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:12px;cursor:pointer;transition:all 0.2s;
}
.chip:active{background:rgba(168,85,247,0.2);border-color:var(--accent)}
/* ── Messages ── */
.msg{
  max-width:82%;padding:13px 17px;border-radius:20px;
  font-size:15px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap;
  animation:msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;letter-spacing:0.1px;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;border-bottom-right-radius:6px;
  box-shadow:0 4px 16px rgba(124,58,237,0.3);
}
.msg.ai{
  align-self:flex-start;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);border-bottom-left-radius:6px;
  backdrop-filter:blur(10px);
}
.msg.ai::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;
  background:linear-gradient(180deg,#a855f7,#06b6d4);
  border-radius:18px 0 0 18px;
}
.msg.interim{
  align-self:flex-end;
  background:rgba(124,58,237,0.25);
  border:1px dashed rgba(168,85,247,0.5);
  color:#c4b5fd;font-style:italic;border-bottom-right-radius:6px;
}
.cursor{
  display:inline-block;width:7px;height:14px;
  background:var(--accent);margin-left:3px;vertical-align:middle;
  animation:blink 1s infinite;border-radius:1px;
}
/* ── Text Input ── */
.text-row{
  padding:10px 20px 6px;display:flex;gap:10px;align-items:center;
}
.text-row input{
  flex:1;padding:14px 18px;border-radius:26px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14.5px;outline:none;
  transition:all 0.2s;
}
.text-row input:focus{border-color:var(--accent);box-shadow:0 0 20px rgba(168,85,247,0.2);background:rgba(255,255,255,0.07)}
.text-row input::placeholder{color:var(--muted)}
.send-btn{
  width:46px;height:46px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#a855f7,#06b6d4);
  color:white;cursor:pointer;flex-shrink:0;
  display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(168,85,247,0.4);
  transition:transform 0.15s;
}
.send-btn:active{transform:scale(0.9)}
/* ── Voice Orb ── */
.orb-area{
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:14px;
  position:relative;
}
.orb-wrap{position:relative;width:104px;height:104px;display:grid;place-items:center}
.orb-ring{
  position:absolute;inset:0;border-radius:50%;border:2px solid transparent;
  background:conic-gradient(from 0deg,#a855f7,#06b6d4,#f472b6,#a855f7) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spin 5s linear infinite;opacity:0.55;
}
.orb-ring2{
  position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(168,85,247,0.2);
  animation:spin 10s linear infinite reverse;
}
.orb{
  width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#a855f7,#6d28d9 60%,#4c1d95);
  position:relative;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 32px rgba(168,85,247,0.5),inset 0 0 20px rgba(255,255,255,0.15);
  transition:all 0.3s;border:none;color:white;
}
.orb:active{transform:scale(0.94)}
.orb svg{width:30px;height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.orb.listening{
  background:radial-gradient(circle at 30% 30%,#f87171,#dc2626 60%,#991b1b);
  box-shadow:0 0 42px rgba(239,68,68,0.7),inset 0 0 20px rgba(255,255,255,0.2);
  animation:orbPulse 0.8s ease-in-out infinite;
}
.orb.thinking{
  background:radial-gradient(circle at 30% 30%,#c084fc,#7c3aed 60%,#4c1d95);
  box-shadow:0 0 42px rgba(192,132,252,0.7),inset 0 0 20px rgba(255,255,255,0.2);
  animation:orbPulse 1.2s ease-in-out infinite;
}
.orb.speaking{
  background:radial-gradient(circle at 30% 30%,#22d3ee,#0891b2 60%,#155e75);
  box-shadow:0 0 42px rgba(6,182,212,0.65),inset 0 0 20px rgba(255,255,255,0.2);
  animation:orbPulse 0.6s ease-in-out infinite;
}
@keyframes orbPulse{50%{transform:scale(1.06)}}
.waveform{
  display:flex;align-items:center;justify-content:center;gap:3px;
  height:22px;opacity:0;transition:opacity 0.3s;
}
.waveform.active{opacity:1}
.waveform span{
  width:3px;background:linear-gradient(180deg,#a855f7,#06b6d4);
  border-radius:3px;height:6px;animation:wave 1s ease-in-out infinite;
}
.waveform span:nth-child(2){animation-delay:0.1s}
.waveform span:nth-child(3){animation-delay:0.2s}
.waveform span:nth-child(4){animation-delay:0.3s}
.waveform span:nth-child(5){animation-delay:0.4s}
.waveform span:nth-child(6){animation-delay:0.3s}
.waveform span:nth-child(7){animation-delay:0.2s}
.waveform span:nth-child(8){animation-delay:0.1s}
.waveform span:nth-child(9){animation-delay:0.05s}
@keyframes wave{0%,100%{height:6px}50%{height:20px}}
.quick-actions{
  display:flex;gap:10px;align-items:center;
  font-size:11px;color:var(--muted);
}
.quick-actions button{
  background:none;border:none;color:var(--muted);
  font-size:11px;cursor:pointer;padding:6px 10px;
  border-radius:8px;transition:all 0.2s;font-family:inherit;
}
.quick-actions button:active{background:var(--surface);color:var(--text)}
/* ── Settings Sheet ── */
.sheet-bg{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  backdrop-filter:blur(6px);z-index:50;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:linear-gradient(180deg,#140f26,#08050f);
  border-top-left-radius:26px;border-top-right-radius:26px;
  border-top:1px solid var(--border);
  padding:20px 22px calc(32px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1);
  max-height:88vh;overflow-y:auto;
  max-width:560px;margin:0 auto;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{
  width:42px;height:4px;border-radius:4px;
  background:rgba(255,255,255,0.18);margin:0 auto 24px;
}
.sheet h3{
  font-size:13.5px;font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;letter-spacing:0.2px;
}
.sheet h3::before{
  content:'';width:3px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#a855f7,#06b6d4);
}
.sheet-section{margin-bottom:28px}
.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.option{
  padding:14px 15px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;transition:all 0.2s;
  text-align:left;font-family:inherit;
}
.option:active{transform:scale(0.97)}
.option.active{
  background:linear-gradient(135deg,rgba(168,85,247,0.22),rgba(6,182,212,0.15));
  border-color:var(--accent);box-shadow:0 0 18px rgba(168,85,247,0.22);
}
.option .opt-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.option .opt-desc{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang-btn{
  padding:11px 6px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:11px;cursor:pointer;
  font-family:inherit;transition:all 0.2s;
}
.lang-btn.active{
  background:linear-gradient(135deg,rgba(168,85,247,0.25),rgba(6,182,212,0.2));
  border-color:var(--accent);
}
.save-btn{
  width:100%;padding:15px;border-radius:15px;
  background:linear-gradient(135deg,#a855f7,#06b6d4);
  border:none;color:white;font-weight:600;font-size:14.5px;
  cursor:pointer;font-family:inherit;letter-spacing:0.3px;
  box-shadow:0 6px 22px rgba(168,85,247,0.4);
}
.save-btn:active{transform:scale(0.98)}
.key-hint{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.key-hint a{color:var(--accent);text-decoration:none}
.toast{
  position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(20,15,35,0.96);border:1px solid var(--border);
  padding:11px 20px;border-radius:22px;font-size:12.5px;
  color:var(--text);backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:all 0.3s;
  z-index:100;white-space:nowrap;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand">
      <div class="logo"><span>से</span></div>
      <div class="brand-info">
        <h1 id="brandName">Senorita</h1>
        <p id="personaLabel">Assistant</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="clearBtn" title="Clear">🗑</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-chip" id="statusChip">
      <span class="dot"></span>
      <span id="statusText">Ready</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-orb"></div>
      <h2 id="welcomeTitle">Hi, I'm Senorita</h2>
      <p id="welcomeText">Ask me anything — I give clear, accurate answers. Tap the mic or type below.</p>
      <div class="welcome-chips">
        <div class="chip" data-q="What's the weather like today?">🌤 Weather</div>
        <div class="chip" data-q="Explain quantum computing in simple words">🧠 Explain</div>
        <div class="chip" data-q="Give me a productivity tip">⚡ Tip</div>
        <div class="chip" data-q="What is the capital of Australia?">🌍 Fact</div>
      </div>
    </div>
  </div>

  <div class="text-row">
    <input id="textInput" type="text" placeholder="Ask anything..." enterkeyhint="send" autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="orb-area">
    <div class="waveform" id="waveform">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="orb-wrap">
      <div class="orb-ring"></div>
      <div class="orb-ring2"></div>
      <button class="orb" id="orb" aria-label="Talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="quick-actions">
      <button id="muteBtn">🔊 Voice ON</button>
      <span>·</span>
      <button id="langQuickBtn">🌐 Auto</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>

  <div class="sheet-section">
    <h3>Gemini API Key</h3>
    <input id="keyInput" type="password" placeholder="AIzaSy..."
      style="width:100%;padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;outline:none">
    <div class="key-hint">
      Free key: <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a><br>
      Saved only on your device.
    </div>
  </div>

  <div class="sheet-section">
    <h3>Response Style</h3>
    <div class="option-grid" id="personaGrid">
      <button class="option active" data-p="concise">
        <div class="opt-title">⚡ Concise</div>
        <div class="opt-desc">Short, direct answers</div>
      </button>
      <button class="option" data-p="detailed">
        <div class="opt-title">📖 Detailed</div>
        <div class="opt-desc">With explanation</div>
      </button>
      <button class="option" data-p="expert">
        <div class="opt-title">🎯 Expert</div>
        <div class="opt-desc">Precise & technical</div>
      </button>
      <button class="option" data-p="friendly">
        <div class="opt-title">💬 Friendly</div>
        <div class="opt-desc">Warm conversation</div>
      </button>
    </div>
  </div>

  <div class="sheet-section">
    <h3>Language</h3>
    <div class="lang-grid" id="langGrid">
      <button class="lang-btn active" data-l="auto">🌐 Auto</button>
      <button class="lang-btn" data-l="hi-IN">🇮🇳 हिन्दी</button>
      <button class="lang-btn" data-l="en-IN">🇬🇧 English</button>
      <button class="lang-btn" data-l="bn-IN">বাংলা</button>
      <button class="lang-btn" data-l="ta-IN">தமிழ்</button>
      <button class="lang-btn" data-l="te-IN">తెలుగు</button>
      <button class="lang-btn" data-l="mr-IN">मराठी</button>
      <button class="lang-btn" data-l="gu-IN">ગુજરાતી</button>
      <button class="lang-btn" data-l="kn-IN">ಕನ್ನಡ</button>
      <button class="lang-btn" data-l="ml-IN">മലയാളം</button>
      <button class="lang-btn" data-l="pa-IN">ਪੰਜਾਬੀ</button>
      <button class="lang-btn" data-l="ur-IN">اردو</button>
    </div>
  </div>

  <div class="sheet-section">
    <h3>Voice</h3>
    <div class="option-grid" id="voiceGrid">
      <button class="option active" data-v="auto">
        <div class="opt-title">🔊 Auto</div>
        <div class="opt-desc">Best natural voice</div>
      </button>
      <button class="option" data-v="off">
        <div class="opt-title">🔇 Silent</div>
        <div class="opt-desc">Text only</div>
      </button>
    </div>
  </div>

  <div class="sheet-section">
    <h3>Assistant Name</h3>
    <input id="nameInput" type="text" maxlength="16" value="Senorita"
      style="width:100%;padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;outline:none">
  </div>

  return (UI[code] && UI[code][key]) || UI.en[key];
}

- If you don't know something, say "I don't know" or "I'm not sure" — never make up facts.

  name:    localStorage.getItem('senorita_name') || 'Senorita',
  voice:   localStorage.getItem('senorita_voice') || 'auto',
  history: []
};

const $ = id => document.getElementById(id);
const chat=$('chat'),orb=$('orb'),statusChip=$('statusChip');
const statusText=$('statusText'),waveform=$('waveform');
const welcome=$('welcome'),toast=$('toast');
const sheet=$('sheet'),sheetBg=$('sheetBg');
const nameInput=$('nameInput'),keyInput=$('keyInput');
const textInput=$('textInput'),sendBtn=$('sendBtn');

function init(){
  $('brandName').textContent = state.name;
  $('personaLabel').textContent = PERSONAS[state.persona].label;
  nameInput.value = state.name;
  keyInput.value = getKey();
  document.title = state.name + ' · AI Assistant';

  document.querySelectorAll('#personaGrid .option').forEach(o=>{
    o.classList.toggle('active', o.dataset.p === state.persona);
  });
  document.querySelectorAll('#langGrid .lang-btn').forEach(o=>{
    o.classList.toggle('active', o.dataset.l === state.lang);
  });
  document.querySelectorAll('#voiceGrid .option').forEach(o=>{
    o.classList.toggle('active', o.dataset.v === state.voice);
  });

  $('muteBtn').textContent = state.voice === 'off' ? '🔇 ' + t('voiceOff') : '🔊 ' + t('voiceOn');
  $('langQuickBtn').textContent = '🌐 ' + LANGS[state.lang].name;
  statusText.textContent = t('ready');
  textInput.placeholder = t('typePlaceholder');

  const wt=$('welcomeTitle'), wp=$('welcomeText');
  if(wt) wt.textContent = t('welcomeTitle');
  if(wp) wp.textContent = t('welcomeText');

  if(!getKey()){
    setTimeout(()=>{
      sheet.classList.add('open'); sheetBg.classList.add('open');
      showToast(t('keyNeeded'));
    }, 800);
  }
}

function setStatus(mode=''){
  const map={'':'ready',listening:'listening',thinking:'thinking',speaking:'speaking'};
  statusText.textContent = t(map[mode]||'ready');
  statusChip.className = 'status-chip ' + mode;
  orb.className = 'orb ' + mode;
  if(mode==='listening') waveform.classList.add('active');
  else waveform.classList.remove('active');
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toast.classList.remove('show'), 2500);
}

function scrollBottom(){ requestAnimationFrame(()=>chat.scrollTop = chat.scrollHeight); }

function addMsg(role, text){
  if(welcome.parentNode) welcome.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chat.appendChild(el);
  scrollBottom();
  return el;
}

/* ═══ STT ═══ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, isListening=false, finalText='', interimEl=null;

if(SR){
  recog = new SR();
  recog.continuous = false;
  recog.interimResults = true;
  recog.maxAlternatives = 1;

  recog.onstart = ()=>{
    isListening = true; finalText = '';
    setStatus('listening');
    interimEl = document.createElement('div');
    interimEl.className = 'msg interim';
    interimEl.textContent = '...';
    if(welcome.parentNode) welcome.remove();
    chat.appendChild(interimEl);
    scrollBottom();
    if(navigator.vibrate) navigator.vibrate(20);
  };

  recog.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const tx = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += tx;
      else interim += tx;
    }
    if(interimEl){
      interimEl.textContent = (finalText + interim) || '...';
      scrollBottom();
    }
  };

  recog.onerror = (e)=>{
    if(e.error==='no-speech') showToast(t('noSpeech'));
    else if(e.error==='not-allowed') showToast(t('needMic'));
    else if(e.error==='aborted'){}
    else showToast('Error: ' + e.error);
    cleanup();
  };

  recog.onend = ()=>{
    cleanup();
    const text = finalText.trim();
    if(text){
      if(interimEl){ interimEl.remove(); interimEl=null; }
      addMsg('user', text);
      askAI(text);
    } else {
      if(interimEl) interimEl.remove();
      setStatus();
    }
  };
}

function cleanup(){
  isListening = false;
  if(orb.className.includes('listening')) setStatus();
}

function startListening(){
  if(!recog){ showToast('Speech not supported'); return; }
  if(!getKey()){
    showToast(t('keyNeeded'));
    sheet.classList.add('open'); sheetBg.classList.add('open');
    return;
  }
  if(isListening){ recog.stop(); return; }
  recog.lang = LANGS[state.lang].stt;
  try{ recog.start(); } catch(e){ console.warn(e); }
}

/* ═══ TEXT INPUT ═══ */
function sendText(){
  const text = textInput.value.trim();
  if(!text) return;
  if(!getKey()){
    showToast(t('keyNeeded'));
    sheet.classList.add('open'); sheetBg.classList.add('open');
    return;
  }
  textInput.value = '';
  addMsg('user', text);
  askAI(text);
  textInput.focus();
}
sendBtn.onclick = sendText;
textInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); sendText(); }
});

/* ═══ GEMINI CALL with retry + fallback ═══ */
async function askAI(prompt){
  const GEMINI_KEY = getKey();
  if(!GEMINI_KEY){
    addMsg('ai', '⚠️ ' + t('keyNeeded'));
    setStatus();
    return;
  }

  setStatus('thinking');

  let langInstr = state.lang === 'auto'
    ? 'Detect the user\'s language and reply in the SAME language. If they mix, mix naturally.'
    : `Reply ONLY in ${LANGS[state.lang].name}.`;

  const systemPrompt = PERSONAS[state.persona].prompt + '\n\n' + langInstr;

  state.history.push({ role:'user', parts:[{text:prompt}] });
  // Trim old history
  if(state.history.length > 20) state.history = state.history.slice(-20);

  const body = {
    systemInstruction:{ parts:[{text:systemPrompt}] },
    contents: state.history,
    generationConfig:{ temperature: 0.7, maxOutputTokens: 700, topP: 0.9 }
  };

  const aiEl = addMsg('ai', '');
  aiEl.innerHTML = '<span class="cursor"></span>';
  let fullText = '';
  let lastErr = null;

  // Try each model
  for(const model of MODELS){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${GEMINI_KEY}`;
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });

      if(!res.ok){
        const errTxt = await res.text();
        // 503 / 429 → try next model
        if(res.status === 503 || res.status === 429){
          lastErr = new Error('Model busy');
          continue;
        }
        throw new Error('API ' + res.status + ': ' + errTxt.slice(0, 180));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      fullText = '';

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, {stream:true});
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for(const line of lines){
          if(!line.startsWith('data: ')) continue;
          const js = line.slice(6).trim();
          if(!js || js === '[DONE]') continue;
          try{
            const parsed = JSON.parse(js);
            const parts = parsed.candidates?.[0]?.content?.parts;
            if(parts) for(const p of parts) if(p.text) fullText += p.text;
          }catch(_){}
        }
        aiEl.innerHTML = escapeHtml(fullText) + '<span class="cursor"></span>';
        scrollBottom();
      }

      // Success
      aiEl.textContent = fullText;
      state.history.push({ role:'model', parts:[{text:fullText}] });
      setStatus();
      speak(fullText);
      return;

    } catch(err){
      lastErr = err;
      // If network / other, try next model too
      continue;
    }
  }

  // All models failed
  aiEl.textContent = '⚠️ ' + (lastErr?.message || 'Something went wrong. Please try again.');
  setStatus();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ═══ VOICE — smarter selection ═══ */
let cachedVoices = [];

function loadVoices(){
  cachedVoices = speechSynthesis.getVoices() || [];
}

function pickBestVoice(lang){
  if(!cachedVoices.length) loadVoices();
  const base = lang.split('-')[0];

  // Priority keywords — female Indian voices
  const femaleHints = ['neerja','swara','female','woman','girl'];
  const brandHints  = ['google','microsoft'];

  // 1. Exact lang + female hint
  let v = cachedVoices.find(x => x.lang === lang && femaleHints.some(h => x.name.toLowerCase().includes(h)));
  if(v) return v;

  // 2. Exact lang + brand
  v = cachedVoices.find(x => x.lang === lang && brandHints.some(h => x.name.toLowerCase().includes(h)));
  if(v) return v;

  // 3. Exact lang (any)
  v = cachedVoices.find(x => x.lang === lang);
  if(v) return v;

  // 4. Base lang + female hint
  v = cachedVoices.find(x => x.lang.startsWith(base) && femaleHints.some(h => x.name.toLowerCase().includes(h)));
  if(v) return v;

  // 5. Base lang + brand
  v = cachedVoices.find(x => x.lang.startsWith(base) && brandHints.some(h => x.name.toLowerCase().includes(h)));
  if(v) return v;

  // 6. Base lang (any)
  v = cachedVoices.find(x => x.lang.startsWith(base));
  if(v) return v;

  // 7. Hindi fallback
  v = cachedVoices.find(x => x.lang.startsWith('hi'));
  if(v) return v;

  return null;
}

function speak(text){
  if(state.voice === 'off' || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();

  // Clean text for TTS
  const clean = text
    .replace(/[*_`#>~]/g, '')
    .replace(/\[.*?\]\(.*?\)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  if(!clean) return;

  // Shorten to first ~350 chars for snappier speech
  const speechText = clean.length > 350 ? clean.slice(0, 350) : clean;

  const u = new SpeechSynthesisUtterance(speechText);

  // Voice decision — if auto-detect mode, use Hindi TTS for Hindi/Devanagari text
  let ttsLang = LANGS[state.lang].tts;
  if(state.lang === 'auto'){
    // Devanagari → Hindi, Bengali, Tamil, etc.
    if(/[\u0900-\u097F]/.test(text)) ttsLang = 'hi-IN';
    else if(/[\u0980-\u09FF]/.test(text)) ttsLang = 'bn-IN';
    else if(/[\u0B80-\u0BFF]/.test(text)) ttsLang = 'ta-IN';
    else if(/[\u0C00-\u0C7F]/.test(text)) ttsLang = 'te-IN';
    else if(/[\u0C80-\u0CFF]/.test(text)) ttsLang = 'kn-IN';
    else if(/[\u0D00-\u0D7F]/.test(text)) ttsLang = 'ml-IN';
    else if(/[\u0A00-\u0A7F]/.test(text)) ttsLang = 'pa-IN';
    else if(/[\u0600-\u06FF]/.test(text)) ttsLang = 'ur-IN';
    else ttsLang = 'en-IN';
  }

  u.lang = ttsLang;
  u.rate = 1.0;
  u.pitch = 1.0;
  u.volume = 1.0;

  const bestVoice = pickBestVoice(ttsLang);
  if(bestVoice) u.voice = bestVoice;

  u.onstart = ()=> setStatus('speaking');
  u.onend = ()=> setStatus();
  u.onerror = ()=> setStatus();

  speechSynthesis.speak(u);
}

/* ═══ EVENTS ═══ */
orb.addEventListener('click', startListening);

document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    const q = c.dataset.q;
    addMsg('user', q);
    askAI(q);
  });
});

$('settingsBtn').onclick = ()=>{ sheet.classList.add('open'); sheetBg.classList.add('open'); };
sheetBg.onclick = ()=>{ sheet.classList.remove('open'); sheetBg.classList.remove('open'); };

$('saveBtn').onclick = ()=>{
  const k = keyInput.value.trim();
  if(k) localStorage.setItem('senorita_key', k);
  state.name = nameInput.value.trim() || 'Senorita';
  localStorage.setItem('senorita_name', state.name);
  localStorage.setItem('senorita_persona', state.persona);
  localStorage.setItem('senorita_lang', state.lang);
  localStorage.setItem('senorita_voice', state.voice);
  init();
  sheet.classList.remove('open'); sheetBg.classList.remove('open');
  showToast(t('settingsSaved'));
};

document.querySelectorAll('#personaGrid .option').forEach(o=>{
  o.onclick = ()=>{
    document.querySelectorAll('#personaGrid .option').forEach(x=>x.classList.remove('active'));
    o.classList.add('active');
    state.persona = o.dataset.p;
    $('personaLabel').textContent = PERSONAS[state.persona].label;
  };
});

document.querySelectorAll('#langGrid .lang-btn').forEach(o=>{
  o.onclick = ()=>{
    document.querySelectorAll('#langGrid .lang-btn').forEach(x=>x.classList.remove('active'));
    o.classList.add('active');
    state.lang = o.dataset.l;
    statusText.textContent = t('ready');
    textInput.placeholder = t('typePlaceholder');
    $('muteBtn').textContent = state.voice === 'off' ? '🔇 ' + t('voiceOff') : '🔊 ' + t('voiceOn');
    const wt=$('welcomeTitle'), wp=$('welcomeText');
    if(wt) wt.textContent = t('welcomeTitle');
    if(wp) wp.textContent = t('welcomeText');
  };
});

document.querySelectorAll('#voiceGrid .option').forEach(o=>{
  o.onclick = ()=>{
    document.querySelectorAll('#voiceGrid .option').forEach(x=>x.classList.remove('active'));
    o.classList.add('active');
    state.voice = o.dataset.v;
    $('muteBtn').textContent = state.voice === 'off' ? '🔇 ' + t('voiceOff') : '🔊 ' + t('voiceOn');
    if(state.voice === 'off') speechSynthesis.cancel();
  };
});

$('muteBtn').onclick = ()=>{
  state.voice = state.voice === 'off' ? 'auto' : 'off';
  localStorage.setItem('senorita_voice', state.voice);
  $('muteBtn').textContent = state.voice === 'off' ? '🔇 ' + t('voiceOff') : '🔊 ' + t('voiceOn');
  document.querySelectorAll('#voiceGrid .option').forEach(x=>{
    x.classList.toggle('active', x.dataset.v === state.voice);
  });
  if(state.voice === 'off') speechSynthesis.cancel();
  showToast(state.voice === 'off' ? t('voiceOff') : t('voiceOn'));
};

$('langQuickBtn').onclick = ()=>{
  const keys = Object.keys(LANGS);
  const next = keys[(keys.indexOf(state.lang) + 1) % keys.length];
  state.lang = next;
  localStorage.setItem('senorita_lang', next);
  document.querySelectorAll('#langGrid .lang-btn').forEach(x=>{
    x.classList.toggle('active', x.dataset.l === next);
  });
  $('langQuickBtn').textContent = '🌐 ' + LANGS[next].name;
  statusText.textContent = t('ready');
  textInput.placeholder = t('typePlaceholder');
  showToast(t('langSet') + LANGS[next].name);
};

$('clearBtn').onclick = ()=>{
  if(!confirm(t('confirmClear'))) return;
  state.history = [];
  chat.innerHTML = '';
  chat.appendChild(welcome);
  welcome.style.display = '';
  setStatus();
  speechSynthesis.cancel();
  showToast(t('chatCleared'));
};

document.addEventListener('keydown', e=>{
  if(e.code === 'Space' && e.target === document.body){
    e.preventDefault();
    startListening();
  }
});

/* Preload voices */
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

init();
</script>
